<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My People">
<title>My People</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #161513;
    --surface: #201e1b;
    --surface2: #2c2a26;
    --border: #3d3a35;
    --blue: #a0c4f5;
    --blue-dim: #1e2e45;
    --purple: #c4a0f5;
    --purple-dim: #2a1e45;
    --green: #b8f5a0;
    --green-dim: #1e3520;
    --amber: #f5d87a;
    --amber-dim: #3a2e10;
    --red: #f5a0a0;
    --red-dim: #3a1e1e;
    --text: #f5f2ec;
    --text-muted: #9a9590;
    --text-faint: #52504a;
    --radius: 16px;
    --radius-sm: 10px;
  }

  body.light {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --surface2: #eeece8;
    --border: #dedad4;
    --blue: #1a5fa8;
    --blue-dim: #ddeaf8;
    --purple: #6b3fbf;
    --purple-dim: #ede8f8;
    --green: #2d7a1f;
    --green-dim: #e4f5e0;
    --amber: #c47f00;
    --amber-dim: #fdf3d8;
    --red: #c0392b;
    --red-dim: #fde8e6;
    --text: #1a1916;
    --text-muted: #8a8680;
    --text-faint: #c5c2bc;
  }

  body.light::before { opacity: 0.15; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.5;
  }

  /* ── VIEWS ── */
  .view { display: none; max-width: 680px; margin: 0 auto; padding-bottom: 48px; }
  .view.active { display: block; }

  /* ── HEADER ── */
  .header {
    padding: 56px 24px 0;
    animation: fadeUp 0.4s ease both;
  }

  .header-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .btn-add {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    flex-shrink: 0;
  }

  .btn-add:active { transform: scale(0.92); background: var(--border); }

  /* ── SEARCH ── */
  .search-wrap {
    margin: 20px 16px 0;
    position: relative;
    animation: fadeUp 0.4s 0.05s ease both;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    display: block;
    flex-shrink: 0;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    padding: 12px 16px 12px 34px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input::placeholder { color: var(--text-faint); }
  .search-input:focus { border-color: var(--amber); }

  /* ── CATEGORY PILLS ── */
  .cat-scroll {
    display: flex;
    gap: 8px;
    padding: 16px 16px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    animation: fadeUp 0.4s 0.1s ease both;
  }

  .cat-scroll::-webkit-scrollbar { display: none; }

  .cat-pill {
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: none;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
  }

  .cat-pill.active, .cat-pill:active {
    color: var(--text);
    border-color: var(--amber);
    background: var(--amber-dim);
  }

  /* ── PEOPLE LIST ── */
  .people-list {
    margin: 16px 16px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: fadeUp 0.4s 0.15s ease both;
  }

  .person-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .person-card:active { transform: scale(0.98); border-color: var(--amber); }

  .person-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    flex-shrink: 0;
    letter-spacing: -0.02em;
  }

  .person-info { flex: 1; min-width: 0; }

  .person-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .person-last {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .person-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }

  .person-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ── CATEGORY BADGE ── */
  .cat-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.04em;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-faint);
  }

  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  .empty-text {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    line-height: 1.8;
  }

  /* ── DETAIL VIEW ── */
  .detail-header {
    padding: 56px 24px 0;
    animation: fadeUp 0.35s ease both;
  }

  .btn-back {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    transition: color 0.15s;
  }

  .btn-back:active { color: var(--text); }

  .detail-person-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 6px;
  }

  .detail-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    flex-shrink: 0;
  }

  .detail-name {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    flex: 1;
    min-width: 0;
  }

  .detail-actions {
    display: flex;
    gap: 8px;
  }

  .btn-icon-sm {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-icon-sm:active { background: var(--red-dim); color: var(--red); border-color: var(--red); }

  .detail-cat-badge {
    margin-bottom: 20px;
    margin-left: 72px;
  }

  /* ── ENTRIES ── */
  .entries-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    margin-top: 24px;
    margin-bottom: 12px;
  }

  .entries-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .btn-add-entry {
    background: var(--amber-dim);
    border: 1px solid rgba(245,216,122,0.2);
    border-radius: 20px;
    color: var(--amber);
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .btn-add-entry:active { transform: scale(0.96); }

  .entries-list {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .entry-section {}

  .entry-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .entry-section-title {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.04em;
  }

  .btn-add-section {
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 14px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Outfit', sans-serif;
  }

  .btn-add-section:active { color: var(--text); border-color: var(--amber); background: var(--amber-dim); }

  .entry-section-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .entry-row {
    position: relative;
    border-radius: var(--radius-sm);
    overflow: hidden;
  }

  .entry-row-content {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .entry-row-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }



  .entry-wrap {
    border-radius: var(--radius-sm);
    overflow: hidden;
    position: relative;
    margin-bottom: 0;
  }

  .entry-delete-bg {
    position: absolute;
    inset: 0;
    background: var(--red-dim);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 20px;
    color: var(--red);
    font-size: 13px;
    font-weight: 700;
    border-radius: var(--radius-sm);
  }

  .entry-inner {
    touch-action: pan-y;
    transition: transform 0.2s ease;
    will-change: transform;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    position: relative;
    z-index: 1;
  }

  .entry-inner.swiping { transition: none; }

  .entry-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .entry-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  .entry-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  .entry-delete-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 14px;
    cursor: pointer;
    padding: 8px;
    margin: -8px;
    flex-shrink: 0;
    transition: color 0.15s;
    min-width: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .entry-delete-btn:active { color: var(--red); }

  .entry-edit-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 15px;
    cursor: pointer;
    padding: 8px;
    margin: -8px;
    flex-shrink: 0;
    transition: color 0.15s;
    min-width: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .entry-edit-btn:active { color: var(--amber); }

  .entry-pin-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 14px;
    cursor: pointer;
    padding: 8px;
    margin: -8px;
    flex-shrink: 0;
    transition: color 0.15s;
    min-width: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .entry-pin-btn.pinned { color: var(--amber); }
  .entry-pin-btn:active { color: var(--amber); }

  .entry-pinned-indicator {
    font-size: 10px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    color: var(--amber);
    margin-right: 4px;
  }

  .btn-show-all {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
    margin-top: 4px;
    transition: all 0.15s;
  }

  .btn-show-all:active { background: var(--surface2); color: var(--text); }

  .entry-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ── MODALS ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 24px 24px 48px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 24px;
  }

  .modal-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }

  .input-group { margin-bottom: 16px; }

  .input-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  input[type="text"], input[type="password"], textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }

  .search-input[type="text"], .search-input[type="password"] {
    padding: 12px 16px 12px 34px !important;
    font-size: 15px;
    background: var(--surface);
  }

  textarea {
    resize: none;
    min-height: 100px;
    line-height: 1.6;
  }

  select option { background: var(--surface2); }
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus { border-color: var(--amber); }

  .tag-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .tag-option {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    background: none;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
  }

  .tag-option.selected {
    color: var(--text);
    border-color: var(--amber);
    background: var(--amber-dim);
  }

  .btn-confirm {
    width: 100%;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: var(--amber);
    color: #ffffff;
    margin-top: 8px;
    transition: transform 0.15s;
  }

  .btn-confirm:active { transform: scale(0.98); }

  .btn-cancel {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 14px;
    margin-top: 4px;
  }

  /* ── CAT COLORS ── */
  .cat-work    { background: var(--blue-dim);   color: var(--blue);   border-color: rgba(160,196,245,0.2); }
  .cat-friend  { background: var(--green-dim);  color: var(--green);  border-color: rgba(184,245,160,0.2); }
  .cat-family  { background: var(--purple-dim); color: var(--purple); border-color: rgba(196,160,245,0.2); }
  .cat-other   { background: var(--amber-dim);  color: var(--amber);  border-color: rgba(245,216,122,0.2); }

  .avatar-work   { background: var(--blue-dim);   color: var(--blue); }
  .avatar-friend { background: var(--green-dim);  color: var(--green); }
  .avatar-family { background: var(--purple-dim); color: var(--purple); }
  .avatar-other  { background: var(--amber-dim);  color: var(--amber); }

  /* ── FLASH ── */
  .flash {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    z-index: 300;
    transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
    white-space: nowrap;
    max-width: 90vw;
  }

  .flash.show { transform: translateX(-50%) translateY(0); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .log-scroll { overflow-y: visible; }
</style>
</head>
<body>

<!-- ══ VIEW: LOGIN ══ -->
<div class="view active" id="viewLogin">
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;max-width:430px;margin:0 auto">
    <div style="position:absolute;top:24px;right:24px">
      <button id="loginThemeBtn" onclick="toggleTheme()" title="Toggle theme" style="width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></svg></button>
    </div>
    <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px">My People</div>
    <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);letter-spacing:0.1em;margin-bottom:48px">PERSONAL CRM</div>

    <div style="width:100%">

  // ── DATA ──
  async function load() {
    const { data: people, error: peopleError } = await supa
      .from('people')
      .select('*')
      .order('name');
    if (peopleError) { showFlash('⚠️ Error loading people'); console.error(peopleError); return; }

      .from('entries')
      .select('*')
      .order('date');
    if (entriesError) { showFlash('⚠️ Error loading notes'); console.error(entriesError); return; }

    db.people = (people || []).map(p => ({
      ...p,
      entries: (entries || []).filter(e => e.person_id === p.id)
    }));
    renderList();

  // ── ROUTING ──
  function showList() {

  // ── RENDER LIST ──
  function highlight(text, q) {
    if (!q) return escHtml(text);
    const idx = text.toLowerCase().indexOf(q);
    if (idx === -1) return escHtml(text);
    return escHtml(text.slice(0, idx)) +
      '<mark style="background:var(--amber);color:#1a1200;border-radius:2px;padding:0 2px">' +
      escHtml(text.slice(idx, idx + q.length)) + '</mark>' +
      escHtml(text.slice(idx + q.length));
  }

  function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    let people = [...db.people];
    if (activeCatFilter !== 'all') people = people.filter(p => p.category === activeCatFilter);
    if (q) {
      people = people.filter(p => {
        const nameMatch = p.name.toLowerCase().includes(q);
        const noteMatch = (p.entries || []).some(e => e.text.toLowerCase().includes(q));
        return nameMatch || noteMatch;
      });
    }
    people.sort((a, b) => a.name.localeCompare(b.name));

    const el = document.getElementById('peopleList');
    if (people.length === 0) {
      const msg = q ? `No results for "<strong>${escHtml(q)}</strong>"` : 'No people yet.<br>Tap ＋ to add someone.';
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">${q ? '🔍' : '👥'}</div><div class="empty-text">${msg}</div></div>`;
      return;
    }

    el.innerHTML = people.map(p => {
      const initials = p.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      // Find matching note snippet if search is active
      let previewText = '';
      let previewHtml = '';
      if (q && !(p.name.toLowerCase().includes(q))) {
        // Name didn't match — find the first matching note and show it
        const matchingEntry = (p.entries || []).find(e => e.text.toLowerCase().includes(q));
        if (matchingEntry) {
          const idx = matchingEntry.text.toLowerCase().indexOf(q);
          const start = Math.max(0, idx - 20);
          const snippet = (start > 0 ? '…' : '') + matchingEntry.text.slice(start, idx + q.length + 30) + (idx + q.length + 30 < matchingEntry.text.length ? '…' : '');
          previewHtml = highlight(snippet, q);
        }
      } else {
        const lastEntry = p.entries && p.entries.length ? p.entries[p.entries.length-1] : null;
        previewHtml = lastEntry ? escHtml(lastEntry.text.slice(0,40)) + (lastEntry.text.length > 40 ? '…' : '') : 'No notes yet';
      }
      const count = p.entries ? p.entries.length : 0;
      return `
        <div class="person-card" onclick="showDetail('${p.id}')">
          <div class="person-avatar avatar-${p.category}">${initials}</div>
          <div class="person-info">
            <div class="person-name">${escHtml(p.name)}</div>
            ${(p.role || p.company) ? `<div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);margin-bottom:2px">${escHtml([p.role,p.company].filter(Boolean).join(' · '))}</div>` : ''}
            <div class="person-last">${previewHtml}</div>
          </div>
          <div class="person-meta">
            <span class="cat-badge cat-${p.category}">${catLabel(p.category)}</span>
            ${(() => { try { if (!p.birthday) return ''; const bp=p.birthday.split(' '); const mn=['January','February','March','April','May','June','July','August','September','October','November','December']; const today=new Date(); const diff=(new Date(today.getFullYear(),mn.indexOf(bp[1]),parseInt(bp[0]))-today)/(864e5); return (diff>=0&&diff<=14)?'<span style="font-size:14px">🎂</span>':''; } catch(e){return '';} })()}
            <span class="person-count">${count} note${count !== 1 ? 's' : ''}</span>
          </div>
        </div>`;
    }).join('');
  }

  // ── RENDER DETAIL ──
  const ALL_TAGS = ['personal','hobby','work','family','health','other'];

  function renderDetail() {
    const p = db.people.find(x => x.id === currentPersonId);
    if (!p) { showList(); return; }
    const initials = p.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    document.getElementById('detailAvatar').className = `detail-avatar avatar-${p.category}`;
    document.getElementById('detailAvatar').textContent = initials;
    document.getElementById('detailName').textContent = p.name;
    document.getElementById('detailCatBadge').className = `cat-badge cat-${p.category}`;
    document.getElementById('detailCatBadge').textContent = catLabel(p.category);
    document.getElementById('deletePersonName').textContent = p.name;

    // Company / role
    const metaParts = [p.role, p.company].filter(Boolean);
    const metaEl = document.getElementById('detailMeta');
    metaEl.textContent = metaParts.join(' · ');

    // Birthday
    const bdEl = document.getElementById('detailBirthday');
    const bdText = document.getElementById('detailBirthdayText');
    if (p.birthday) {
      bdEl.style.display = 'block';
      try {
        const bdParts = p.birthday.split(' ');
        const bdDay = parseInt(bdParts[0]);
        const bdMonthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const bdMonth = bdMonthNames.indexOf(bdParts[1]);
        const today = new Date();
        const thisYearBd = new Date(today.getFullYear(), bdMonth, bdDay);
        const diff = (thisYearBd - today) / (1000*60*60*24);
        if (diff >= 0 && diff <= 14) {
          bdEl.style.color = 'var(--amber)';
          bdText.textContent = p.birthday + ' — coming up soon! 🎉';
        } else {
          bdEl.style.color = 'var(--text-muted)';
          bdText.textContent = p.birthday;
        }
      } catch(e) {
        bdEl.style.color = 'var(--text-muted)';
        bdText.textContent = p.birthday;
      }
    } else {
      bdEl.style.display = 'none';
    }

    const entries = p.entries || [];
    const list = document.getElementById('entriesList');

    if (entries.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">No notes yet.<br>Tap "+ Add note" to log something.</div></div>`;
      return;
    }

    // Group entries by tag, preserving original indices
    const groups = {};
    entries.forEach((e, i) => {
      if (!groups[e.tag]) groups[e.tag] = [];
      groups[e.tag].push({ ...e, origIndex: i });
    });

    const COLLAPSE_AT = 3;

    function renderEntryRow(e) {
      const d = new Date(e.date);
      const dateStr = d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'});
      const pinIcon = e.pinned
        ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
      return `
        <div class="entry-row" id="ewrap-${e.origIndex}">
          <div class="entry-delete-bg">DELETE ✕</div>
          <div class="entry-inner" id="eitem-${e.origIndex}"
            ontouchstart="entrySwipeStart(event,${e.origIndex})"
            ontouchmove="entrySwipeMove(event,${e.origIndex})"
            ontouchend="entrySwipeEnd(event,${e.origIndex})">
            <div class="entry-row-content">
              <div class="entry-text">${escHtml(e.text)}</div>
              <div class="entry-row-footer">
                <span class="entry-date">${dateStr}</span>
                <div style="display:flex;gap:4px;align-items:center">
                  <button class="entry-pin-btn ${e.pinned ? 'pinned' : ''}" onclick="togglePin(${e.origIndex})" title="${e.pinned ? 'Unpin' : 'Pin'}">${pinIcon}</button>
                  <button class="entry-edit-btn" onclick="openEditEntry(${e.origIndex})">✎</button>
                  <button class="entry-delete-btn" onclick="openDeleteEntry(${e.origIndex})">✕</button>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    let html = '';
    ALL_TAGS.forEach(tag => {
      if (!groups[tag] || groups[tag].length === 0) return;
      // Pinned first, then newest first
      const tagEntries = groups[tag].slice().sort((a, b) => {
        if (b.pinned && !a.pinned) return 1;
        if (a.pinned && !b.pinned) return -1;
        return new Date(b.date) - new Date(a.date);
      });
      const visible = tagEntries.slice(0, COLLAPSE_AT);
      const hidden = tagEntries.slice(COLLAPSE_AT);
      const sectionId = 'section-' + tag + '-' + currentPersonId;

      html += `
        <div class="entry-section">
          <div class="entry-section-header">
            <span class="entry-section-title" style="${tagStyle(tag)}">${tagLabel(tag)}</span>
            <button class="btn-add-section" onclick="openAddEntryWithTag('${tag}')">＋</button>
          </div>
          <div class="entry-section-items">
            ${visible.map(e => renderEntryRow(e)).join('')}
            ${hidden.length > 0 ? `
              <div id="${sectionId}-more" style="display:none">
                ${hidden.map(e => renderEntryRow(e)).join('')}
              </div>
              <button class="btn-show-all" onclick="toggleSection('${sectionId}')">
                <span id="${sectionId}-label">+ ${hidden.length} older note${hidden.length > 1 ? 's' : ''}</span>
              </button>` : ''}
          </div>
        </div>`;
    });

    list.innerHTML = html;
  }

  // ── SWIPE TO DELETE ENTRIES ──
  function entrySwipeStart(e, index) {
    const t = e.touches[0];
    swipeState[index] = { startX: t.clientX, startY: t.clientY, dx: 0, active: true };
  }

  function entrySwipeMove(e, index) {
    const s = swipeState[index];
    if (!s || !s.active) return;
    const t = e.touches[0];
    const dx = t.clientX - s.startX;
    const dy = t.clientY - s.startY;
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(s.dx) < 5) { s.active = false; return; }
    if (dx > 0) return;
    s.dx = dx;
    const el = document.getElementById('eitem-' + index);
    if (el) { el.classList.add('swiping'); el.style.transform = 'translateX(' + Math.max(dx, -110) + 'px)'; }
  }

  function entrySwipeEnd(e, index) {
    const s = swipeState[index];
    if (!s) return;
    const el = document.getElementById('eitem-' + index);
    if (el) {
      el.classList.remove('swiping');
      if (Math.abs(s.dx) > 80) {
        el.style.transform = 'translateX(-110px)';
        setTimeout(() => openDeleteEntry(index), 150);
      } else {
        el.style.transform = '';
      }
    }
    delete swipeState[index];
  }

  // ── MODALS ──
  function openModal(id) {
    // Close any other open modals first
    document.querySelectorAll('.modal-overlay.open').forEach(el => el.classList.remove('open'));
    document.getElementById(id).classList.add('open');
  }
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }
  function handleOverlay(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

  // ── HELPERS ──
  function catLabel(c) {
    return {work:'💼 Work', friend:'👋 Friend', family:'🏠 Family', other:'✦ Other'}[c] || c;
  }

  function tagLabel(t) {
    return {personal:'👤 Personal', hobby:'🎯 Hobby', work:'💼 Work', family:'🏠 Family', health:'❤️ Health', other:'✦ Other'}[t] || t;
  }

  function tagStyle(t) {
    const styles = {
      personal: 'background:var(--blue-dim);color:var(--blue)',
      hobby:    'background:var(--green-dim);color:var(--green)',
      work:     'background:var(--amber-dim);color:var(--amber)',
      family:   'background:var(--purple-dim);color:var(--purple)',
      health:   'background:var(--red-dim);color:var(--red)',
      other:    'background:var(--surface2);color:var(--text-muted)',
    };
    return styles[t] || styles.other;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showFlash(msg) {
    const el = document.getElementById('flash');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }


  // ── VOICE INPUT ──
  let recognition = null;
  let isListening = false;

  function toggleVoice() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      showFlash('🎤 Voice not supported in this browser');
      return;
    }
    if (isListening) {
      stopVoice();
    } else {
      startVoice();
    }
  }

  function startVoice() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'nl-BE'; // Dutch (Belgium) — change to 'en-GB' if preferred
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      const btn = document.getElementById('micBtn');
      btn.style.background = 'var(--red-dim)';
      btn.style.borderColor = 'rgba(245,160,160,0.4)';
      btn.style.color = 'var(--red)';
      document.getElementById('micIcon').textContent = '⏹';
      document.getElementById('micLabel').textContent = 'Stop';
      const status = document.getElementById('micStatus');
      status.style.display = 'block';
      status.textContent = 'Listening…';
    };

    recognition.onresult = (e) => {
      let interim = '';
      let final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t;
        else interim += t;
      }
      const textarea = document.getElementById('inputEntry');
      const existing = textarea.value;
      if (final) {
        textarea.value = (existing ? existing + ' ' : '') + final.trim();
        document.getElementById('micStatus').textContent = '✓ Got it';
      } else {
        document.getElementById('micStatus').textContent = interim || 'Listening…';
      }
    };

    recognition.onerror = (e) => {
      stopVoice();
      const msgs = { 'not-allowed': '🎤 Microphone access denied', 'no-speech': '🎤 No speech detected', 'network': '🎤 Network error' };
      showFlash(msgs[e.error] || '🎤 Error: ' + e.error);
    };

    recognition.onend = () => { stopVoice(); };

    recognition.start();
  }

  function stopVoice() {
    if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
    isListening = false;
    const btn = document.getElementById('micBtn');
    if (!btn) return;
    btn.style.background = 'var(--surface2)';
    btn.style.borderColor = 'var(--border)';
    btn.style.color = 'var(--text-muted)';
    document.getElementById('micIcon').textContent = '🎤';
    document.getElementById('micLabel').textContent = 'Speak';
    const status = document.getElementById('micStatus');
    if (status.textContent === 'Listening…') status.style.display = 'none';
  }

  // ── THEME ──
  const SUN_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></svg>';
  const MOON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function setThemeIcons(isLight) {
    const icon = isLight ? MOON_SVG : SUN_SVG;
    const btn = document.getElementById('themeBtn');
    const loginBtn = document.getElementById('loginThemeBtn');
    if (btn) btn.innerHTML = icon;
    if (loginBtn) loginBtn.innerHTML = icon;
  }

  function themeKey() {
    const uid = localStorage.getItem('crm_uid');
    return uid ? `crm_theme_${uid}` : 'crm_theme';
  }

  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    setThemeIcons(isLight);
    localStorage.setItem(themeKey(), isLight ? 'light' : 'dark');
  }

  function initTheme(userId) {
    if (userId) localStorage.setItem('crm_uid', userId);
    const saved = localStorage.getItem(themeKey());
    const isLight = saved === 'light';
    if (isLight) document.body.classList.add('light');
    else document.body.classList.remove('light');
    setThemeIcons(isLight);
  }

  // ── INIT ──
  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    // Check existing session first (handles page refresh)
    const { data: { session } } = await supa.auth.getSession();
    if (session) {
      initTheme(session.user.id);
      document.getElementById('viewLogin').classList.remove('active');
      document.getElementById('viewList').classList.add('active');
      document.getElementById('loggedInEmail').textContent = session.user.email || '';
      document.getElementById('loggedInEmail').title = session.user.email || '';
      await load();
    }

    // Then listen for future changes (login/logout)
    supa.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN') {
        initTheme(session.user.id);
        document.getElementById('viewLogin').classList.remove('active');
        document.getElementById('viewList').classList.add('active');
        document.getElementById('loggedInEmail').textContent = session.user.email || '';
        document.getElementById('loggedInEmail').title = session.user.email || '';
        await load();
      } else if (event === 'SIGNED_OUT') {
        document.getElementById('viewList').classList.remove('active');
        document.getElementById('viewDetail').classList.remove('active');
        document.getElementById('viewLogin').classList.add('active');
        db = { people: [] };
      }
    });
  });
</script>
</body>
</html>
